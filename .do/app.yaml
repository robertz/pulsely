name: pulsely
region: nyc

domains:
  - domain: pulsely.dev
    type: PRIMARY
  - domain: www.pulsely.dev
    type: ALIAS

databases:
  - name: amos
    cluster_name: amos
    db_name: pulsely
    db_user: rob
    engine: MYSQL
    production: true

services:
  - name: pulsely
    dockerfile_path: /Dockerfile
    source_dir: /
    github:
      repo: robertz/pulsely
      branch: main
      deploy_on_push: true
    http_port: 8080
    instance_count: 1
    instance_size_slug: apps-s-1vcpu-2gb
    health_check:
      http_path: /
      initial_delay_seconds: 90
      period_seconds: 10
      failure_threshold: 6
    envs:
      - key: ENVIRONMENT
        value: production
      - key: BOXLANG_DEBUG
        value: "false"
      - key: DB_DRIVER
        value: MySQL
      - key: DB_HOST
        value: ${amos.HOSTNAME}
      - key: DB_PORT
        value: ${amos.PORT}
      - key: DB_DATABASE
        value: ${amos.DATABASE}
      - key: DB_USER
        value: ${amos.USERNAME}
      - key: DB_PASSWORD
        value: ${amos.PASSWORD}
      - key: DB_USE_SSL
        value: "true"
      - key: JWT_SECRET
        value: EDIT_IN_UI
        type: SECRET
      - key: S3_ACCESS_KEY
        value: EDIT_IN_UI
        type: SECRET
      - key: S3_SECRET_KEY
        value: EDIT_IN_UI
        type: SECRET
      - key: S3_REGION
        value: nyc3
      - key: S3_DOMAIN
        value: digitaloceanspaces.com
